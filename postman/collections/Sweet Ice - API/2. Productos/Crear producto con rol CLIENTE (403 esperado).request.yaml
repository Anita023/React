$kind: http-request
url: "{{base_url}}/productos"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token_cliente}}
body:
  type: text
  content: |-
    {
      "slug": "prueba2",
      "nombre": "Prueba2",
      "descripcion": "x",
      "precio": 1000
    }
scripts:
  - type: afterResponse
    code: pm.test('403 rol incorrecto', function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 7000
