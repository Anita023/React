$kind: http-request
url: "{{base_url}}/productos/{{producto_id}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token_admin}}
body:
  type: text
  content: |-
    {
      "precio": 7500
    }
scripts:
  - type: afterResponse
    code: pm.test('200 OK', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000
