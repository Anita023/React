$kind: http-request
url: "{{base_url}}/productos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "slug": "prueba",
      "nombre": "Prueba",
      "descripcion": "x",
      "precio": 1000
    }
scripts:
  - type: afterResponse
    code: pm.test('401 sin token', function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 6000
