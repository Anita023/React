$kind: http-request
url: "{{base_url}}/usuarios/{{usuario_id_cliente}}/estado"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{token_admin}}
body:
  type: text
  content: |-
    {
      "estado": "inactivo"
    }
scripts:
  - type: afterResponse
    code: pm.test('200 OK', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 3000
