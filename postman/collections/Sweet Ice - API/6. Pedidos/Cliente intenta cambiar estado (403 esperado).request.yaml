$kind: http-request
url: "{{base_url}}/pedidos/{{pedido_id}}/estado"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{token_cliente}}
body:
  type: text
  content: |-
    {
      "estado": "entregado"
    }
scripts:
  - type: afterResponse
    code: pm.test('403 rol incorrecto', function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 5000
