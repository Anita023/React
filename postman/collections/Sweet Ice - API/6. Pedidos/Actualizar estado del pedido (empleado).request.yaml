$kind: http-request
url: "{{base_url}}/pedidos/{{pedido_id}}/estado"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{token_empleado}}
body:
  type: text
  content: |-
    {
      "estado": "en_proceso"
    }
scripts:
  - type: afterResponse
    code: pm.test('200 OK', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000
