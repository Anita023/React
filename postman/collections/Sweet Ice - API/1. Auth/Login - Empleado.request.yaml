$kind: http-request
url: "{{base_url}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "correo": "{{correo_empleado}}",
      "password": "{{password_empleado}}",
      "recordar": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login empleado exitoso (200)', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Guardar token empleado', function () {
        const datos = pm.response.json();
        pm.environment.set('token_empleado', datos.token);
      });
    language: text/javascript
order: 4000
