$kind: http-request
url: "{{base_url}}/perfil"
method: GET
headers:
  Authorization: Bearer {{token_cliente}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Perfil obtenido (200)', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 6000
