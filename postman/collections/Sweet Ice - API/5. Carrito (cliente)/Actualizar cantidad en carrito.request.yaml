$kind: http-request
url: "{{base_url}}/carrito/{{carrito_item_id}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token_cliente}}
body:
  type: text
  content: |-
    {
      "cantidad": 3
    }
scripts:
  - type: afterResponse
    code: pm.test('200 OK', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 3000
