$kind: http-request
url: "{{base_url}}/carrito"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token_cliente}}
body:
  type: text
  content: |-
    {
      "productoId": 1,
      "cantidad": 2
    }
scripts:
  - type: afterResponse
    code: pm.test('201 Creado', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 1000
